  <text x="28" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="url(#g)" letter-spacing="0.5">E-Learning</text>
  <text x="28" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="url(#gl)" letter-spacing="2.5">MANAGEMENT INFORMATION SYSTEM</text>
